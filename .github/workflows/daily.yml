yaml

name: Daily Build and Publish

on:
  schedule:
    # Kör varje dag kl 04:00 svensk tid på vintern
    - cron: '0 3 * * *'

  # Gör det möjligt att starta manuellt
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Hämta dina filer från repository
      - name: Get repository
        uses: actions/checkout@v6

      # Installera Python
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Kör ditt befintliga Python-script
      - name: Run build.py
        run: python build.py

      # Förbered GitHub Pages
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Ladda upp innehållet i docs
      - name: Upload docs
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      # Publicera till GitHub Pages
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
